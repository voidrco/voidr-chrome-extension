<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voidr Testing Assistant</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="../assets/lucide-icons.js"></script>
    <script src="../services/testPlanningService.js"></script>
  </head>
  <body>
    <div class="extension-container">
      <div class="extension-header">
        <div class="logo-container">
          <img src="../assets/logo-light.svg" alt="Voidr Logo" class="logo-icon" />
        </div>
        <div class="version">v1.0.0</div>
      </div>

      <!-- Main Extension Interface -->
      <div class="extension-content" id="main-extension-content">
        <!-- Will be populated by the main extension interface -->
      </div>

      <div class="extension-footer">
        <button id="open-options" class="footer-button">
          <span class="icon-settings"></span>
          Settings
        </button>

        <a href="https://voidr.com" target="_blank" class="footer-button">
          <span class="icon-external-link-small"></span>
          About
        </a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
