<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voidr Testing Assistant</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="../assets/lucide-icons.js"></script>
    <script src="../services/testPlanningService.js"></script>
    <script src="../services/defectsService.js"></script>
    <script src="../services/privateStorageService.js"></script>
  </head>
  <body>
    <div class="extension-container">
      <div class="extension-header">
        <div class="logo-container">
          <img src="../assets/logo-light.svg" alt="Voidr Logo" class="logo-icon" />
        </div>
        <button id="sync-all-btn" class="voidr-action-btn" title="Sync now">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1,4 1,10 7,10"/>
            <polyline points="23,20 23,14 17,14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
        </button>
        <div class="version">v1.0.0</div>
      </div>

      <!-- Main Extension Interface -->
      <div class="extension-content" id="main-extension-content">
        <!-- Will be populated by the main extension interface -->
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
