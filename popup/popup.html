<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voidr Session Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="popup.css" />
    <script src="../config/env.js"></script>
    <!-- Dev-only overrides (gitignored) — loaded only if the file exists,
         so production consoles stay free of ERR_FILE_NOT_FOUND noise -->
    <script src="../config/env-local-loader.js"></script>
    <script src="../assets/lucide-icons.js"></script>
  </head>
  <body>
    <div class="extension-container">
      <div class="extension-header">
        <div class="logo-container">
          <img src="../assets/logo-light.svg" alt="Voidr" class="logo-icon" />
        </div>
      </div>

      <section id="debug-service-settings" class="debug-service-settings" hidden>
        <div class="debug-service-heading">
          <span class="debug-service-badge">DEBUG</span>
          <span>Service URL</span>
        </div>
        <div class="debug-service-controls">
          <input
            id="debug-service-url"
            class="debug-service-input"
            type="url"
            spellcheck="false"
            placeholder="https://branch.api-preview.voidr.co/v1"
          />
          <button id="debug-service-save" class="btn-primary btn-sm">Salvar</button>
        </div>
        <div class="debug-service-meta">
          <span id="debug-service-status" class="debug-service-status"></span>
          <button id="debug-service-reset" class="debug-service-reset">Usar produção</button>
        </div>
      </section>

      <div class="extension-content" id="main-extension-content"></div>

      <div class="extension-footer">
        <div id="extension-version" class="version">v1.0.0</div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
