name: Tests

on:
  pull_request:
    branches: [master, staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The browser download is the least predictable step in this job — a slow
      # one has already burned the whole budget and cancelled the run before the
      # performance test could start. Keyed on the resolved Playwright version,
      # since that is what decides which build is needed.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # System libraries live outside the cached directory, so they are
      # installed on every run — that part is apt-only and comparatively quick.
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run client-side performance tests
        run: npm run test:performance
        env:
          PERF_CPU_THROTTLE: 2

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-performance-report
          path: performance/results
